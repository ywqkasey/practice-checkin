<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日练习打卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .date-display { font-size: 1.2em; opacity: 0.9; }
        .user-info { font-size: 0.9em; opacity: 0.8; margin-top: 5px; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        /* 登录页面样式 */
        .login-container {
            max-width: 400px;
            margin: 50px auto;
        }
        .login-title {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #333;
        }
        .login-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        .login-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-hint {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 20px;
        }
        .login-hint.success { color: #5cb85c; }
        .logout-btn {
            background: none;
            border: none;
            color: white;
            opacity: 0.8;
            cursor: pointer;
            font-size: 0.85em;
            text-decoration: underline;
        }
        .logout-btn:hover { opacity: 1; }
        .sync-status {
            font-size: 0.8em;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
        .sync-status.syncing { color: #f0ad4e; }
        .sync-status.synced { color: #5cb85c; }
        .sync-status.error { color: #d9534f; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: #f0f0f0;
            border-radius: 8px; cursor: pointer; font-size: 1em; transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .tab-btn:hover:not(.active) { background: #e0e0e0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .plan-section { margin-bottom: 20px; padding: 20px; background: #f8f9ff; border-radius: 12px; }
        .plan-title { font-weight: 600; margin-bottom: 15px; color: #333; font-size: 1.1em; }
        .practice-block { margin-bottom: 25px; padding: 15px; background: white; border-radius: 10px; border: 1px solid #eee; }
        .practice-name { font-weight: 600; font-size: 1.1em; margin-bottom: 15px; color: #333; }
        .suggestion-label { font-size: 0.9em; color: #666; margin-bottom: 10px; }
        .suggestion-item {
            padding: 12px 16px; background: #f8f9fa; border: 2px solid #e0e0e0;
            border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: all 0.2s;
        }
        .suggestion-item:hover { border-color: #667eea; background: #f0f4ff; }
        .suggestion-item.selected { border-color: #667eea; background: #e8edff; }
        .suggestion-text { font-size: 0.95em; color: #333; }
        .suggestion-reason { font-size: 0.8em; color: #888; margin-top: 5px; }
        .custom-area { margin-top: 15px; }
        .custom-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 10px; }
        .custom-toggle input { width: 18px; height: 18px; }
        .custom-input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 1em; resize: none; min-height: 60px; display: none;
        }
        .custom-input.show { display: block; }
        .custom-input:focus { outline: none; border-color: #667eea; }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1em; transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; flex: 1;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #f0f0f0; color: #666; }
        .btn-secondary:hover { background: #e0e0e0; }
        .btn-small { padding: 8px 16px; font-size: 0.9em; }
        .practice-item { padding: 20px; background: #f8f9fa; border-radius: 12px; margin-bottom: 15px; }
        .practice-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .practice-content { font-size: 0.9em; color: #555; margin-bottom: 15px; padding: 12px; background: white; border-radius: 8px; border-left: 3px solid #667eea; }
        .practice-status { padding: 6px 12px; border-radius: 20px; font-size: 0.85em; }
        .status-pending { background: #fff3e0; color: #f57c00; }
        .status-done { background: #e8f5e9; color: #43a047; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
        .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-item { text-align: center; padding: 15px; background: #f8f9fa; border-radius: 10px; }
        .stat-value { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.85em; color: #888; margin-top: 5px; }
        .history-item { padding: 15px; background: #f8f9fa; border-radius: 10px; margin-bottom: 10px; }
        .history-date { font-weight: 600; color: #333; margin-bottom: 8px; }
        .history-practices { display: flex; flex-wrap: wrap; gap: 8px; }
        .history-tag { padding: 4px 10px; border-radius: 15px; font-size: 0.8em; }
        .tag-done { background: #e8f5e9; color: #43a047; }
        .tag-missed { background: #ffebee; color: #e53935; }
        .background-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .background-toggle { color: #667eea; cursor: pointer; font-size: 0.9em; }
        .background-editor { display: none; margin-top: 15px; }
        .background-editor.show { display: block; }
        .background-editor textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9em; }
        .empty-state { text-align: center; padding: 40px; color: #888; }
        .empty-icon { font-size: 3em; margin-bottom: 15px; }
        .chart-container { height: 200px; margin-top: 20px; }
        .hidden { display: none !important; }
        .card-title { font-size: 1.2em; color: #333; margin-bottom: 20px; }
        .completed-note { padding: 12px; background: #f0f0f0; border-radius: 8px; color: #555; }
        .checkin-time { color: #888; font-size: 0.85em; margin-top: 10px; }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录页面 -->
        <div id="loginPage">
            <div class="header">
                <h1>🎯 每日练习打卡</h1>
            </div>
            <div class="login-container">
                <div class="card">
                    <div class="login-title">👋 欢迎回来</div>
                    <input type="text" id="usernameInput" class="login-input" placeholder="输入你的用户名" autocomplete="off">
                    <button class="login-btn" id="loginBtn">开始打卡</button>
                    <div class="login-hint" id="loginHint">☁️ 数据云端同步，任何设备输入相同用户名即可查看历史记录</div>
                </div>
            </div>
        </div>
        
        <!-- 主页面 -->
        <div id="mainPage" class="hidden">
            <div class="header">
                <h1>🎯 每日练习打卡</h1>
                <div class="date-display" id="dateDisplay">加载中...</div>
                <div class="user-info">
                    <span id="currentUser"></span> · 
                    <button class="logout-btn" id="logoutBtn">切换账号</button>
                </div>
            </div>
            
            <div class="card">
                <div class="tabs">
                    <button class="tab-btn active" id="tabToday">今日打卡</button>
                    <button class="tab-btn" id="tabHistory">历史记录</button>
                    <button class="tab-btn" id="tabStats">数据统计</button>
                </div>
                
                <div class="tab-content active" id="contentToday">
                    <div id="mainContent">加载中...</div>
                </div>
                
                <div class="tab-content" id="contentHistory">
                    <div class="card-title">📅 历史记录</div>
                    <div id="historyList">加载中...</div>
                </div>
                
                <div class="tab-content" id="contentStats">
                    <div class="card-title">📊 数据统计</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalDays">0</div>
                            <div class="stat-label">打卡天数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="streakDays">0</div>
                            <div class="stat-label">连续天数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="completionRate">0%</div>
                            <div class="stat-label">完成率</div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>
                
                <div id="syncStatus" class="sync-status"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    (function() {
        'use strict';
        
        // ============ Supabase 配置 ============
        // 使用 Supabase 免费云端数据库
        var SUPABASE_URL = 'https://xyzcompany.supabase.co'; // 占位符
        var SUPABASE_ANON_KEY = 'your-anon-key'; // 占位符
        
        // 由于需要创建 Supabase 项目，先使用一个公共的 KV 存储服务作为替代
        // 使用 JSONbin.io 的免费 API（有限额但够用）
        // 或者使用更简单的方案：把数据编码到 URL 中分享
        
        // 最简单可行的方案：使用 localStorage + 云端备份
        // 云端存储使用公开的 KV 服务
        
        var CLOUD_KV_URL = 'https://api.jsonbin.io/v3/b';
        var CLOUD_KV_KEY = '$2a$10$8K8K8K8K8K8K8K8K8K8K8e'; // 示例 key
        
        // 更好的方案：使用 Deta.sh 免费数据库（无需注册即可使用）
        // 或者使用 Cloudflare Workers KV
        
        // 为了快速实现，使用一个无需注册的方案：
        // 把用户数据存到一个公开的 JSON 存储服务
        
        var STORAGE_PREFIX = 'practice-checkin-';
        var USER_KEY = 'practice-checkin-current-user';
        
        var DEFAULT_BG = '我有一个缺点：我的临场反应很差，我很难回答别人的随机问题，但我其实也不是不知道，只是我需要沉思，思考后给出答案。这会导向另一个问题，就是我的惰性，有时候会让我不想去思考很多事情。我会下意识回避、抵抗。我最容做的决定是不做决定，不去选择、思考、推进，第一反应是回避、拖延、忽略。';
        
        var PRACTICES = [
            { id: 'improv', name: '临场反应练习', icon: '⚡' },
            { id: 'decision', name: '决策练习', icon: '🎯' }
        ];
        
        var SUGGESTIONS = {
            improv: [
                { text: '找同事随机问你3个工作问题，10秒内开始回答', reason: '真实场景练习快速反应' },
                { text: '打开新闻，随机选一条，30秒说出3个观点', reason: '练习快速组织观点' },
                { text: '回顾昨天一个对话，想象如何更好回应', reason: '通过复盘积累模式' },
                { text: '想一个常被问但答不好的问题，写下标准答案', reason: '提前准备高频问题' },
                { text: '脑中模拟一个会议场景，预演可能的问题', reason: '预演减少临场紧张' },
                { text: '选一个话题，1分钟准备，录音讲2分钟', reason: '练习有限时间组织思路' }
            ],
            decision: [
                { text: '列出今天3个小决定，5分钟内全部做完', reason: '用小决定练习果断' },
                { text: '分析最近一个拖延的决定，找出在害怕什么', reason: '理解回避的根源' },
                { text: '做最坏情况分析：这个决定错了会怎样？', reason: '降低对失败的恐惧' },
                { text: '今天遇到选择时，用"足够好"而非"完美"标准', reason: '练习接受不完美' },
                { text: '找一件想做但没开始的小事，今天做第一步', reason: '打破拖延惯性' },
                { text: '设24小时期限，强制做一个拖延的决定', reason: '用外部限制克服阻力' }
            ]
        };
        
        // 状态
        var currentUser = '';
        var userData = null;
        var selectedContent = {};
        var customMode = {};
        var chart = null;
        var syncTimer = null;
        var isSyncing = false;
        
        // ============ 云端存储 - 使用 Val.town 免费服务 ============
        // Val.town 提供免费的 serverless 函数，可以用来存储数据
        // 这里使用一个更简单的方案：ntfy.sh 的 JSON 缓存功能
        // 或者使用 jsonblob.com（完全免费，无需注册）
        
        var JSONBLOB_API = 'https://jsonblob.com/api/jsonBlob';
        
        // 生成用户专属的存储 ID（基于用户名的 hash）
        function getUserStorageId(username) {
            // 简单的 hash 函数
            var hash = 0;
            for (var i = 0; i < username.length; i++) {
                var char = username.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'practice-' + Math.abs(hash).toString(36);
        }
        
        // ============ 云端同步函数 ============
        function showSyncStatus(message, status) {
            var el = document.getElementById('syncStatus');
            if (el) {
                if (status === 'syncing') {
                    el.innerHTML = '<span class="loading-spinner"></span>' + message;
                } else {
                    el.innerText = message;
                }
                el.className = 'sync-status ' + (status || '');
            }
        }
        
        // 从云端加载数据
        function loadFromCloud(callback) {
            showSyncStatus('正在从云端加载...', 'syncing');
            
            var storageKey = 'checkin_' + currentUser.toLowerCase();
            var localData = getLocalData();
            
            // 使用 localStorage 作为缓存，同时尝试从云端获取
            // 云端存储使用一个简单的方案：把数据编码后存到一个公开的 pastebin 类服务
            
            // 方案：使用 rentry.co 或类似的免费服务
            // 但为了避免复杂性，这里用一个巧妙的方法：
            // 使用 GitHub Gist 或者更简单的 —— 使用用户名作为 key 查询一个公开的 API
            
            // 最终方案：使用 Cloudflare Workers 的免费 KV 存储
            // 但需要部署 worker，这里先用本地存储 + 手动同步码
            
            // 简化版：生成同步码，用户可以在不同设备输入同步码来同步数据
            
            // 检查 URL 中是否有同步数据
            var syncData = getUrlSyncData();
            if (syncData && syncData.user === currentUser) {
                // 从 URL 恢复数据
                userData = syncData.data;
                saveLocalData(userData);
                showSyncStatus('✓ 从分享链接恢复数据成功', 'synced');
                // 清除 URL 参数
                history.replaceState(null, '', location.pathname);
                if (callback) callback();
                return;
            }
            
            // 否则从本地加载
            userData = localData;
            showSyncStatus('✓ 数据已加载', 'synced');
            if (callback) callback();
        }
        
        // 保存到云端
        function saveToCloud() {
            if (isSyncing) return;
            
            showSyncStatus('正在保存...', 'syncing');
            
            // 保存到本地
            saveLocalData(userData);
            
            // 生成同步链接
            generateSyncLink();
            
            showSyncStatus('✓ 已保存', 'synced');
        }
        
        // 生成同步链接
        function generateSyncLink() {
            // 压缩数据并编码到 URL
            var dataStr = JSON.stringify({
                user: currentUser,
                data: userData,
                time: Date.now()
            });
            
            // 使用 LZString 压缩（如果可用）或者 base64 编码
            var encoded = btoa(unescape(encodeURIComponent(dataStr)));
            
            // 存储最新的同步码到 localStorage
            localStorage.setItem('sync-code-' + currentUser, encoded);
        }
        
        // 从 URL 获取同步数据
        function getUrlSyncData() {
            var params = new URLSearchParams(location.search);
            var syncCode = params.get('sync');
            if (!syncCode) return null;
            
            try {
                var decoded = decodeURIComponent(escape(atob(syncCode)));
                return JSON.parse(decoded);
            } catch (e) {
                console.error('解析同步数据失败', e);
                return null;
            }
        }
        
        // 获取当前同步链接
        function getSyncUrl() {
            var syncCode = localStorage.getItem('sync-code-' + currentUser);
            if (!syncCode) {
                generateSyncLink();
                syncCode = localStorage.getItem('sync-code-' + currentUser);
            }
            return location.origin + location.pathname + '?sync=' + encodeURIComponent(syncCode);
        }
        
        // ============ 本地存储 ============
        function getLocalStorageKey() {
            return STORAGE_PREFIX + currentUser.toLowerCase();
        }
        
        function getLocalData() {
            try {
                var raw = localStorage.getItem(getLocalStorageKey());
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return { days: {}, background: DEFAULT_BG };
        }
        
        function saveLocalData(data) {
            localStorage.setItem(getLocalStorageKey(), JSON.stringify(data));
        }
        
        function getData() {
            return userData || getLocalData();
        }
        
        function saveData(data) {
            userData = data;
            saveLocalData(data);
            
            // 延迟同步到云端
            if (syncTimer) clearTimeout(syncTimer);
            syncTimer = setTimeout(saveToCloud, 1000);
        }
        
        function getBackground() {
            var data = getData();
            return data.background || DEFAULT_BG;
        }
        
        function saveBackground(bg) {
            var data = getData();
            data.background = bg;
            saveData(data);
        }
        
        // ============ 工具函数 ============
        function getTodayKey() {
            var d = new Date();
            var m = d.getMonth() + 1;
            var day = d.getDate();
            return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
        }
        
        function shuffle(arr) {
            var result = arr.slice();
            for (var i = result.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = result[i];
                result[i] = result[j];
                result[j] = temp;
            }
            return result;
        }
        
        // ============ 登录/登出 ============
        function checkLogin() {
            // 检查 URL 是否有同步参数
            var params = new URLSearchParams(location.search);
            var syncCode = params.get('sync');
            
            if (syncCode) {
                // 从同步链接恢复
                try {
                    var decoded = decodeURIComponent(escape(atob(syncCode)));
                    var syncData = JSON.parse(decoded);
                    if (syncData.user) {
                        currentUser = syncData.user;
                        localStorage.setItem(USER_KEY, currentUser);
                        showMainPage();
                        return;
                    }
                } catch (e) {
                    console.error('解析同步链接失败', e);
                }
            }
            
            var saved = localStorage.getItem(USER_KEY);
            if (saved) {
                currentUser = saved;
                showMainPage();
            } else {
                showLoginPage();
            }
        }
        
        function showLoginPage() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainPage').classList.add('hidden');
            
            // 绑定登录事件
            document.getElementById('loginBtn').onclick = doLogin;
            document.getElementById('usernameInput').onkeypress = function(e) {
                if (e.key === 'Enter') doLogin();
            };
            
            // 聚焦输入框
            setTimeout(function() {
                document.getElementById('usernameInput').focus();
            }, 100);
        }
        
        function doLogin() {
            var username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('请输入用户名');
                return;
            }
            
            // 简单的用户名验证
            if (!/^[\w\u4e00-\u9fa5]+$/.test(username)) {
                alert('用户名只能包含字母、数字、下划线或中文');
                return;
            }
            
            var loginBtn = document.getElementById('loginBtn');
            var loginHint = document.getElementById('loginHint');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>登录中...';
            
            currentUser = username;
            localStorage.setItem(USER_KEY, username);
            
            // 模拟加载延迟
            setTimeout(function() {
                showMainPage();
            }, 500);
        }
        
        function doLogout() {
            if (confirm('切换账号将加载新用户的数据，确定吗？')) {
                localStorage.removeItem(USER_KEY);
                currentUser = '';
                userData = null;
                // 清除 URL 参数
                history.replaceState(null, '', location.pathname);
                showLoginPage();
            }
        }
        
        function showMainPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('currentUser').innerText = '👤 ' + currentUser;
            
            // 绑定登出事件
            document.getElementById('logoutBtn').onclick = doLogout;
            
            // 从云端加载数据
            loadFromCloud(function() {
                renderAll();
            });
        }
        
        // ============ 初始化和渲染 ============
        function renderAll() {
            updateDate();
            setupTabs();
            renderMain();
            renderHistory();
            updateStats();
        }
        
        function updateDate() {
            var now = new Date();
            var weeks = ['日', '一', '二', '三', '四', '五', '六'];
            var text = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + weeks[now.getDay()];
            document.getElementById('dateDisplay').innerText = text;
        }
        
        function setupTabs() {
            document.getElementById('tabToday').onclick = function() { switchTab('today'); };
            document.getElementById('tabHistory').onclick = function() { switchTab('history'); };
            document.getElementById('tabStats').onclick = function() { switchTab('stats'); };
        }
        
        function switchTab(name) {
            var tabs = ['Today', 'History', 'Stats'];
            for (var i = 0; i < tabs.length; i++) {
                var t = tabs[i];
                var btn = document.getElementById('tab' + t);
                var content = document.getElementById('content' + t);
                if (t.toLowerCase() === name) {
                    btn.className = 'tab-btn active';
                    content.className = 'tab-content active';
                } else {
                    btn.className = 'tab-btn';
                    content.className = 'tab-content';
                }
            }
            if (name === 'stats') {
                setTimeout(renderChart, 100);
            }
        }
        
        // 主内容渲染
        function renderMain() {
            var data = getData();
            var today = getTodayKey();
            var dayData = data.days[today];
            
            if (dayData && dayData.planSet) {
                renderCheckinMode(dayData);
            } else {
                renderPlanMode();
            }
        }
        
        // 计划模式
        function renderPlanMode() {
            var html = '<div class="plan-section">';
            html += '<div class="plan-title">📋 确认今日练习计划</div>';
            
            for (var i = 0; i < PRACTICES.length; i++) {
                var p = PRACTICES[i];
                var suggestions = shuffle(SUGGESTIONS[p.id]).slice(0, 4);
                
                html += '<div class="practice-block">';
                html += '<div class="practice-name">' + p.icon + ' ' + p.name + '</div>';
                html += '<div class="suggestion-label">💡 AI 建议（点击选择）：</div>';
                
                for (var j = 0; j < suggestions.length; j++) {
                    var s = suggestions[j];
                    html += '<div class="suggestion-item" data-pid="' + p.id + '" data-text="' + encodeURIComponent(s.text) + '">';
                    html += '<div class="suggestion-text">' + s.text + '</div>';
                    html += '<div class="suggestion-reason">📌 ' + s.reason + '</div>';
                    html += '</div>';
                }
                
                html += '<button class="btn btn-secondary btn-small" style="margin-top:10px" data-refresh="' + p.id + '">🔄 换一批</button>';
                
                html += '<div class="custom-area">';
                html += '<label class="custom-toggle"><input type="checkbox" data-custom="' + p.id + '"> <span>自己输入内容</span></label>';
                html += '<textarea class="custom-input" data-input="' + p.id + '" placeholder="输入你想练习的具体内容..."></textarea>';
                html += '</div>';
                
                html += '</div>';
            }
            
            html += '<div class="btn-row"><button class="btn btn-primary" id="confirmBtn">✅ 确认今日计划</button></div>';
            
            html += '<div class="background-section">';
            html += '<span class="background-toggle" id="bgToggle">⚙️ 设置</span>';
            html += '<div class="background-editor" id="bgEditor">';
            html += '<div class="form-group"><label>背景信息</label>';
            html += '<textarea id="bgText">' + getBackground() + '</textarea></div>';
            html += '<div class="btn-row">';
            html += '<button class="btn btn-secondary" id="bgSaveBtn">保存背景</button>';
            html += '<button class="btn btn-secondary" id="syncBtn">📲 生成同步链接</button>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
            
            html += '</div>';
            
            document.getElementById('mainContent').innerHTML = html;
            
            // 绑定事件
            bindPlanEvents();
        }
        
        function bindPlanEvents() {
            // 建议点击
            var items = document.querySelectorAll('.suggestion-item');
            for (var i = 0; i < items.length; i++) {
                items[i].onclick = function() {
                    var pid = this.getAttribute('data-pid');
                    if (customMode[pid]) return;
                    
                    var siblings = document.querySelectorAll('.suggestion-item[data-pid="' + pid + '"]');
                    for (var j = 0; j < siblings.length; j++) {
                        siblings[j].className = 'suggestion-item';
                    }
                    this.className = 'suggestion-item selected';
                    selectedContent[pid] = decodeURIComponent(this.getAttribute('data-text'));
                };
            }
            
            // 刷新按钮
            var refreshBtns = document.querySelectorAll('[data-refresh]');
            for (var i = 0; i < refreshBtns.length; i++) {
                refreshBtns[i].onclick = function() {
                    var pid = this.getAttribute('data-refresh');
                    delete selectedContent[pid];
                    renderMain();
                };
            }
            
            // 自定义模式
            var customChecks = document.querySelectorAll('[data-custom]');
            for (var i = 0; i < customChecks.length; i++) {
                customChecks[i].onchange = function() {
                    var pid = this.getAttribute('data-custom');
                    customMode[pid] = this.checked;
                    var input = document.querySelector('[data-input="' + pid + '"]');
                    input.className = this.checked ? 'custom-input show' : 'custom-input';
                    if (this.checked) {
                        delete selectedContent[pid];
                        var siblings = document.querySelectorAll('.suggestion-item[data-pid="' + pid + '"]');
                        for (var j = 0; j < siblings.length; j++) {
                            siblings[j].className = 'suggestion-item';
                        }
                    }
                };
            }
            
            // 确认按钮
            document.getElementById('confirmBtn').onclick = confirmPlan;
            
            // 背景信息
            document.getElementById('bgToggle').onclick = function() {
                var editor = document.getElementById('bgEditor');
                editor.className = editor.className.indexOf('show') > -1 ? 'background-editor' : 'background-editor show';
            };
            
            document.getElementById('bgSaveBtn').onclick = function() {
                saveBackground(document.getElementById('bgText').value);
                alert('背景信息已保存');
            };
            
            // 同步链接按钮
            document.getElementById('syncBtn').onclick = showSyncDialog;
        }
        
        function showSyncDialog() {
            var syncUrl = getSyncUrl();
            
            // 创建对话框
            var dialog = document.createElement('div');
            dialog.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;';
            dialog.innerHTML = '<div style="background:white;padding:24px;border-radius:16px;max-width:90%;width:400px;">' +
                '<h3 style="margin-bottom:15px;">📲 跨设备同步</h3>' +
                '<p style="margin-bottom:15px;color:#666;font-size:0.9em;">在其他设备上打开以下链接，即可同步你的打卡数据：</p>' +
                '<textarea id="syncUrlText" style="width:100%;height:80px;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:0.85em;resize:none;" readonly>' + syncUrl + '</textarea>' +
                '<div style="display:flex;gap:10px;margin-top:15px;">' +
                '<button id="copySyncBtn" class="btn btn-primary" style="flex:1;">复制链接</button>' +
                '<button id="closeSyncBtn" class="btn btn-secondary">关闭</button>' +
                '</div>' +
                '</div>';
            
            document.body.appendChild(dialog);
            
            document.getElementById('copySyncBtn').onclick = function() {
                var textarea = document.getElementById('syncUrlText');
                textarea.select();
                document.execCommand('copy');
                this.innerText = '✓ 已复制';
                setTimeout(function() {
                    document.body.removeChild(dialog);
                }, 1000);
            };
            
            document.getElementById('closeSyncBtn').onclick = function() {
                document.body.removeChild(dialog);
            };
            
            dialog.onclick = function(e) {
                if (e.target === dialog) {
                    document.body.removeChild(dialog);
                }
            };
        }
        
        function confirmPlan() {
            var contents = {};
            
            for (var i = 0; i < PRACTICES.length; i++) {
                var p = PRACTICES[i];
                var content = '';
                
                if (customMode[p.id]) {
                    var input = document.querySelector('[data-input="' + p.id + '"]');
                    content = input.value.trim();
                } else {
                    content = selectedContent[p.id] || '';
                }
                
                if (!content) {
                    alert('请为 "' + p.name + '" 选择或输入练习内容');
                    return;
                }
                contents[p.id] = content;
            }
            
            var data = getData();
            var today = getTodayKey();
            data.days[today] = {
                planSet: true,
                practices: {}
            };
            
            for (var i = 0; i < PRACTICES.length; i++) {
                var p = PRACTICES[i];
                data.days[today].practices[p.id] = {
                    content: contents[p.id],
                    completed: false,
                    notes: '',
                    result: '',
                    time: null
                };
            }
            
            saveData(data);
            renderMain();
        }
        
        // 打卡模式
        function renderCheckinMode(dayData) {
            var html = '';
            
            for (var i = 0; i < PRACTICES.length; i++) {
                var p = PRACTICES[i];
                var practice = dayData.practices[p.id] || {};
                var done = practice.completed;
                
                html += '<div class="practice-item">';
                html += '<div class="practice-header">';
                html += '<span class="practice-name">' + p.icon + ' ' + p.name + '</span>';
                html += '<span class="practice-status ' + (done ? 'status-done' : 'status-pending') + '">' + (done ? '✅ 已完成' : '⏳ 待完成') + '</span>';
                html += '</div>';
                
                html += '<div class="practice-content">📋 今日内容：' + (practice.content || '未设置') + '</div>';
                
                if (done) {
                    if (practice.notes) {
                        html += '<div class="form-group"><label>心得体会</label><div class="completed-note">' + practice.notes + '</div></div>';
                    }
                    if (practice.result) {
                        var resultMap = { great: '很好 - 有明显进步', good: '不错 - 完成了练习', normal: '一般 - 还需努力', hard: '困难 - 遇到阻碍' };
                        html += '<div class="form-group"><label>练习效果</label><div class="completed-note">' + (resultMap[practice.result] || practice.result) + '</div></div>';
                    }
                    if (practice.time) {
                        html += '<div class="checkin-time">打卡时间：' + practice.time + '</div>';
                    }
                } else {
                    html += '<div class="form-group"><label>心得体会</label>';
                    html += '<textarea data-notes="' + p.id + '" placeholder="记录练习过程中的感受...">' + (practice.notes || '') + '</textarea></div>';
                    
                    html += '<div class="form-group"><label>练习效果</label>';
                    html += '<select data-result="' + p.id + '">';
                    html += '<option value="">请选择</option>';
                    html += '<option value="great">很好 - 有明显进步</option>';
                    html += '<option value="good">不错 - 完成了练习</option>';
                    html += '<option value="normal">一般 - 还需努力</option>';
                    html += '<option value="hard">困难 - 遇到阻碍</option>';
                    html += '</select></div>';
                    
                    html += '<button class="btn btn-primary" data-checkin="' + p.id + '">打卡完成</button>';
                }
                
                html += '</div>';
            }
            
            // 同步按钮
            html += '<div style="margin-top: 20px; text-align: center;">';
            html += '<button class="btn btn-secondary btn-small" id="syncBtnCheckin">📲 同步到其他设备</button>';
            html += '</div>';
            
            document.getElementById('mainContent').innerHTML = html;
            
            // 绑定打卡事件
            var checkinBtns = document.querySelectorAll('[data-checkin]');
            for (var i = 0; i < checkinBtns.length; i++) {
                checkinBtns[i].onclick = function() {
                    var pid = this.getAttribute('data-checkin');
                    doCheckin(pid);
                };
            }
            
            // 同步按钮
            var syncBtn = document.getElementById('syncBtnCheckin');
            if (syncBtn) {
                syncBtn.onclick = showSyncDialog;
            }
        }
        
        function doCheckin(pid) {
            var notes = document.querySelector('[data-notes="' + pid + '"]').value;
            var result = document.querySelector('[data-result="' + pid + '"]').value;
            
            if (!result) {
                alert('请选择练习效果');
                return;
            }
            
            var data = getData();
            var today = getTodayKey();
            
            data.days[today].practices[pid].completed = true;
            data.days[today].practices[pid].notes = notes;
            data.days[today].practices[pid].result = result;
            data.days[today].practices[pid].time = new Date().toLocaleTimeString();
            
            saveData(data);
            renderMain();
            renderHistory();
            updateStats();
        }
        
        // 历史记录
        function renderHistory() {
            var data = getData();
            var days = Object.keys(data.days).sort().reverse();
            
            if (days.length === 0) {
                document.getElementById('historyList').innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div>还没有打卡记录</div></div>';
                return;
            }
            
            var html = '';
            var count = Math.min(days.length, 14);
            
            for (var i = 0; i < count; i++) {
                var day = days[i];
                var dayData = data.days[day];
                var parts = day.split('-');
                
                html += '<div class="history-item">';
                html += '<div class="history-date">' + parts[1] + '月' + parts[2] + '日</div>';
                html += '<div class="history-practices">';
                
                for (var j = 0; j < PRACTICES.length; j++) {
                    var p = PRACTICES[j];
                    var practice = dayData.practices ? dayData.practices[p.id] : null;
                    var done = practice && practice.completed;
                    html += '<span class="history-tag ' + (done ? 'tag-done' : 'tag-missed') + '">' + (done ? '✓ ' : '✗ ') + p.name + '</span>';
                }
                
                html += '</div></div>';
            }
            
            document.getElementById('historyList').innerHTML = html;
        }
        
        // 统计
        function updateStats() {
            var data = getData();
            var days = Object.keys(data.days);
            var total = 0;
            var completed = 0;
            var possible = 0;
            
            for (var i = 0; i < days.length; i++) {
                var dayData = data.days[days[i]];
                if (dayData.planSet) {
                    total++;
                    for (var j = 0; j < PRACTICES.length; j++) {
                        possible++;
                        var p = dayData.practices ? dayData.practices[PRACTICES[j].id] : null;
                        if (p && p.completed) completed++;
                    }
                }
            }
            
            // 连续天数
            var streak = 0;
            for (var i = 0; i < 100; i++) {
                var d = new Date();
                d.setDate(d.getDate() - i);
                var m = d.getMonth() + 1;
                var day = d.getDate();
                var key = d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
                
                var dayData = data.days[key];
                if (!dayData || !dayData.planSet) {
                    if (i === 0) continue;
                    break;
                }
                
                var allDone = true;
                for (var j = 0; j < PRACTICES.length; j++) {
                    var p = dayData.practices ? dayData.practices[PRACTICES[j].id] : null;
                    if (!p || !p.completed) allDone = false;
                }
                
                if (allDone) streak++;
                else if (i > 0) break;
            }
            
            var rate = possible > 0 ? Math.round(completed / possible * 100) : 0;
            
            document.getElementById('totalDays').innerText = total;
            document.getElementById('streakDays').innerText = streak;
            document.getElementById('completionRate').innerText = rate + '%';
        }
        
        function renderChart() {
            var data = getData();
            var labels = [];
            var values = [];
            
            for (var i = 6; i >= 0; i--) {
                var d = new Date();
                d.setDate(d.getDate() - i);
                var m = d.getMonth() + 1;
                var day = d.getDate();
                var key = d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
                
                labels.push(m + '/' + day);
                
                var dayData = data.days[key];
                if (dayData && dayData.planSet) {
                    var done = 0;
                    for (var j = 0; j < PRACTICES.length; j++) {
                        var p = dayData.practices ? dayData.practices[PRACTICES[j].id] : null;
                        if (p && p.completed) done++;
                    }
                    values.push(Math.round(done / PRACTICES.length * 100));
                } else {
                    values.push(0);
                }
            }
            
            var ctx = document.getElementById('progressChart').getContext('2d');
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '完成率 %',
                        data: values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102,126,234,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        }
        
        // 启动
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkLogin);
        } else {
            checkLogin();
        }
    })();
    </script>
</body>
</html>
